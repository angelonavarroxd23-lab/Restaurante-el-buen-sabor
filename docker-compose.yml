name: sistema-restaurante

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD (ejecute scripts/init-env.sh)}
      MYSQL_DATABASE: ${DB_NAME:-restaurante_db}
      MYSQL_USER: ${DB_USER:-restaurante_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD (ejecute scripts/init-env.sh)}
      TZ: America/Lima
    volumes:
      # Persistencia: los datos sobreviven a "docker compose down" y reinicios
      - mysql_data:/var/lib/mysql
      # Esquema + datos semilla: solo se ejecuta la primera vez (volumen vacío)
      - ./database/restaurante_db.sql:/docker-entrypoint-initdb.d/01-restaurante_db.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/${DB_NAME:-restaurante_db}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USER:-restaurante_app}
      DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET (ejecute scripts/init-env.sh)}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  mysql_data:
